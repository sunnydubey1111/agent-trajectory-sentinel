name: ci

# The fast job must stay green on every push; the slow job carries the module
# self-tests and the end-to-end behavioural snapshot.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn pandas matplotlib pytest
      - name: Compile every module
        run: python -m compileall -q derail verification experimental devtools tests
      - name: Fast tests
        run: python -m pytest -m "not slow and not network and not ollama"

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn pandas matplotlib pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Self-tests and behavioural snapshot
        run: python -m pytest -m "slow and not network and not ollama"
