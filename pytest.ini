[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --durations=10
markers =
    slow: takes more than ~10 s (excluded from the fast gate with -m "not slow")
    network: reaches an external network service (arXiv, DuckDuckGo, ...)
    ollama: needs a local Ollama server with the required model pulled
    artifact: reads committed result artifacts under results/
filterwarnings =
    error::SyntaxWarning
